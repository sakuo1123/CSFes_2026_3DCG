<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS2026｜展示・サークル紹介</title>
<style>
/* ★編集ポイント
   動画：<source src="movie/opening.mp4">
   サークル情報：下の <script> の circleData
   部屋の背景：.room の --room-img に画像を指定（例：url(img/room.jpg)） */
:root{--glass:rgba(222,222,222,.96);--accent:#5fc9c1;--text:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* ---------- 世界（横スワイプ） ---------- */
#world{position:relative;height:100svh;overflow:hidden;background:#000}
#track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
#world:not(.finished) #track{overflow:hidden}
.panel{flex:0 0 100vw;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center}
.frame{position:relative;width:min(100vw,calc(100svh*9/16));aspect-ratio:9/16;overflow:hidden;font-size:min(3.4vw,1.9svh)}
.room{background:
  linear-gradient(transparent 57%,#a3b2b2 57%),
  linear-gradient(90deg,#869fa1 62%,#9bafaf 62%);
  background-size:cover}
.room[style*="--room-img"]{background:var(--room-img) center/cover}
#introVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#8aa;display:block}

/* 動画終了後に出るUI */
.ui{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s .3s}
.finished .ui{opacity:1;pointer-events:auto}

/* ---------- 波紋（タップできるものの目印） ---------- */
.ripple{position:relative}
.ripple::before,.ripple::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;
  opacity:0;pointer-events:none;animation:rip 2.6s ease-out infinite}
.ripple::after{animation-delay:1.3s}
@keyframes rip{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.75);opacity:0}}
button:active{transform:scale(.94)}

/* ---------- アイコン ---------- */
.ic{position:absolute;width:var(--s,27%);aspect-ratio:1;border-radius:50%;background:#dcdcdc;color:var(--text);
  display:grid;place-items:center;text-align:center;font-size:.8em;line-height:1.35;overflow:visible;
  box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .2s}
.ic img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.ic small{display:block;font-size:.85em}
.ic.mini{--s:12%;font-size:.45em}
.finished .ic{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
.finished .ic:nth-of-type(2){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(80px) scale(.85)}}

/* 部屋ラベル・ヒント */
.tag{position:absolute;transform:translateX(-50%);text-align:center;font-size:1em;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.tag .ic{position:relative;--s:100%;width:3.4em;margin:.5em auto 0;font-size:.55em;display:grid}
.hint{position:absolute;left:0;right:0;top:25%;text-align:center;font-size:1.15em;letter-spacing:.08em}
.hint .arrow{display:block;margin-top:.6em;font-size:1.8em;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(.35em)}}
.tapnote{position:absolute;left:0;right:0;top:41%;text-align:center;font-size:1.5em;letter-spacing:.06em}
.scrollbtn{position:absolute;right:6%;bottom:4%;display:grid;justify-items:center;gap:.4em;font-size:.8em;z-index:3}
.scrollbtn b{font-weight:400;font-size:2.6em;line-height:1;animation:down 1.6s ease-in-out infinite}
@keyframes down{50%{transform:translateY(.25em)}}

/* ---------- 再生前の案内 ---------- */
#attention{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,8,9,.6);backdrop-filter:blur(8px);
  cursor:pointer;transition:opacity .7s,visibility .7s;text-align:center}
#attention.hidden{opacity:0;visibility:hidden;pointer-events:none}
#attention .t{font-size:clamp(22px,6vw,34px);letter-spacing:.08em;margin:12px 0 26px}
#attention .k{font-size:11px;letter-spacing:.25em;opacity:.7}
#attention .go{display:inline-block;position:relative;padding:14px 28px;border:1px solid #fff;border-radius:99px;font-size:12px;letter-spacing:.14em}
#attention .go::before,#attention .go::after{border-radius:99px}

/* ---------- 下部（Map・制作者） ---------- */
#info{padding:70px 8vw 100px;background:#000}
#info h2{margin:0 0 22px;font-weight:400;font-size:32px}
.map{position:relative;aspect-ratio:1.5;background:#4a4a4a;font-size:11px}
.pin{position:absolute;display:flex;align-items:center;gap:8px}
.pin i{width:20px;height:20px;border-radius:50%;background:var(--accent)}
.profile{display:grid;grid-template-columns:90px 1fr;gap:20px;align-items:center;margin-top:70px;font-size:13px;line-height:1.7}
.profile .pi{aspect-ratio:1;background:#ddd}
.profile strong{display:block;font-weight:400;margin-bottom:4px}
.coop{margin-top:50px;text-align:center;font-size:13px;line-height:1.8}
.thanks{margin-top:60px;text-align:center;font-size:13px;letter-spacing:.1em}
.reveal{opacity:0;transform:translateY(24px);transition:1s}
.reveal.visible{opacity:1;transform:none}

/* ---------- ポップアップ ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:4svh 6vw;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.modal.open{opacity:1;pointer-events:auto}
.panelbox{width:min(420px,100%);max-height:78svh;overflow:auto;border-radius:28px;padding:28px 22px 26px;background:var(--glass);color:var(--text);
  text-align:center;transform:translateY(30px) scale(.96);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.modal.open .panelbox{transform:none}
.micon{width:34%;aspect-ratio:1;margin:0 auto 14px;background:#fff;border-radius:12px;display:grid;place-items:center;overflow:hidden;font-size:12px}
.micon img{width:100%;height:100%;object-fit:cover}
.panelbox h2{margin:0 0 8px;font-size:22px}
.sub{font-size:13px;line-height:1.6;margin-bottom:16px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:6px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;background:#fff;display:grid;place-items:center;font-size:14px}
.slide img{width:100%;height:100%;object-fit:cover}
.dots{display:flex;justify-content:center;gap:9px;margin:12px 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;transition:.25s}
.dots i.on{background:var(--accent);transform:scale(1.2)}
.desc{margin:0;font-size:13px;line-height:1.9}
.sns{width:54px;height:54px;margin:22px auto 0;border-radius:50%;background:#fff;color:var(--text);text-decoration:none;display:grid;place-items:center;font-size:11px}
.close{padding:12px 34px;background:var(--glass);color:var(--text);font-size:14px;border-radius:99px}

@media (prefers-reduced-motion:reduce){.ripple::before,.ripple::after,.hint .arrow,.scrollbtn b{animation:none}}
</style>
</head>
<body class="lock">

<section id="world">
  <div id="attention">
    <div><div class="k">CS2026 / EXHIBITION</div><div class="t">映像が流れます</div><div class="go ripple">TAP TO START</div></div>
  </div>

  <div id="track">

    <!-- 左：展示教室（仮想空間研究会） -->
    <div class="panel"><div class="frame room">
      <div class="tapnote">アイコンをタップ</div>
      <button class="ic ripple" data-circle="circle3" style="left:36%;top:50%" aria-label="仮想空間研究会を開く">サークル<br>アイコン3<small>(仮想空間研究会)</small></button>
      <button class="scrollbtn" data-scroll>scroll<b>↓</b></button>
    </div></div>

    <!-- 中央：トップページ（動画→最終フレーム） -->
    <div class="panel"><div class="frame">
      <video id="introVideo" muted playsinline preload="auto"><source src="opening.mp4" type="video/mp4"></video>
      <div class="ui">
        <div class="hint">スワイプして移動<span class="arrow">⟷</span></div>
        <button class="tag" style="left:28%;top:46%" data-go="0">4A教室<span class="ic ripple">3</span></button>
        <button class="tag" style="left:82%;top:47%" data-go="2">4A教室<span class="ic ripple">2・1</span></button>
        <button class="scrollbtn" data-scroll>scroll<b>↓</b></button>
      </div>
    </div></div>

    <!-- 右：展示教室（3DCG同好会・ゲーム研究会） -->
    <div class="panel"><div class="frame room">
      <div class="tapnote">アイコンをタップ</div>
      <button class="ic ripple" data-circle="circle2" style="left:9%;top:47%" aria-label="3DCG同好会を開く">サークル<br>アイコン2<small>(3DCG同好会)</small></button>
      <button class="ic ripple" data-circle="circle1" style="left:62%;top:61%" aria-label="ゲーム研究会を開く">サークル<br>アイコン1<small>(ゲーム研究会)</small></button>
      <button class="scrollbtn" data-scroll>scroll<b>↓</b></button>
    </div></div>

  </div>
</section>

<footer id="info">
  <h2 class="reveal">Map</h2>
  <div class="map reveal">
    <div class="pin" style="left:12%;top:12%"><i class="ripple"></i>3DCG同好会 / ゲーム研究会</div>
    <div class="pin" style="left:8%;top:34%"><i class="ripple"></i>仮想空間研究会</div>
  </div>
  <div class="profile reveal"><div class="pi"></div>
    <div><strong>オープニングムービー・サイトデザイン</strong>3DCG同好会　代表<br>メディアデザイン専攻領域 3年<br>長谷川さくお</div></div>
  <div class="coop reveal">協力<br>────────<br>3DCG同好会<br>仮想空間研究会<br>ゲーム研究会</div>
  <div class="thanks reveal">Thank you for watching !</div>
</footer>

<!-- ポップアップ -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="panelbox">
    <div class="micon"><img id="mIcon" alt="" hidden><span id="mIconText">サークルアイコン</span></div>
    <h2 id="mTitle"></h2>
    <div class="sub" id="mSub"></div>
    <div class="slides" id="slides"></div>
    <div class="dots" id="dots"></div>
    <p class="desc" id="mDesc"></p>
    <a class="sns" id="mSns" href="#" target="_blank" rel="noopener">SNS</a>
  </div>
  <button class="close" id="close">× Close</button>
</div>

<script>
/* ★サークル情報：ここを編集（photos に画像パスを並べるとスライドで見られます） */
const circleData = {
  circle1:{title:"ゲーム研究会",subtitle:"ゲームをつくる、遊ぶ、考える",
    description:"ゲームをテーマに、企画・制作・研究などを行っています。芸祭ではメンバーによるゲーム作品を体験できます。",
    icon:"",photos:[],sns:"#"},
  circle2:{title:"3DCG同好会",subtitle:"3DCGを用いた<br>映像、フィギュア、メディアを展示",
    description:"3DCGを中心に、映像・ゲーム・フィギュアなど幅広い制作を行っています。今回の芸祭では、メンバーそれぞれの作品を展示します。",
    icon:"",photos:[],sns:"#"},
  circle3:{title:"仮想空間研究会",subtitle:"3DCG × 仮想空間",
    description:"仮想空間やデジタル表現について研究・制作しています。展示では制作した空間やインタラクティブ作品を紹介します。",
    icon:"",photos:[],sns:"#"}
};

const $ = id => document.getElementById(id);
const world=$("world"), track=$("track"), video=$("introVideo"), attention=$("attention");
const modal=$("modal"), slides=$("slides"), dots=$("dots");

/* ---- 横スワイプ ---- */
const goTo = i => track.scrollTo({left:i*track.clientWidth, behavior:"smooth"});
const center = () => track.scrollTo({left:track.clientWidth, behavior:"instant"});
center(); addEventListener("resize", center);
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goTo(+b.dataset.go));
document.querySelectorAll("[data-scroll]").forEach(b => b.onclick = () => $("info").scrollIntoView({behavior:"smooth"}));
addEventListener("keydown", e => {
  if (!world.classList.contains("finished")) return;
  const i = Math.round(track.scrollLeft/track.clientWidth);
  if (e.key==="ArrowLeft") goTo(Math.max(0,i-1));
  if (e.key==="ArrowRight") goTo(Math.min(2,i+1));
  if (e.key==="Escape") closeModal();
});

/* ---- オープニング ---- */
function finish(){
  world.classList.add("finished");
  document.body.classList.remove("lock");
}
function start(){
  attention.classList.add("hidden");
  video.play().catch(finish);
}
attention.onclick = start;
video.addEventListener("ended", () => setTimeout(finish, 250));
video.addEventListener("error", finish);

/* ---- ポップアップ ---- */
function openCircle(id){
  const d = circleData[id]; if(!d) return;
  $("mTitle").textContent = d.title;
  $("mSub").innerHTML = d.subtitle;
  $("mDesc").textContent = d.description;
  $("mSns").href = d.sns;
  $("mIcon").hidden = !d.icon; $("mIconText").hidden = !!d.icon;
  if (d.icon) $("mIcon").src = d.icon;
  const list = d.photos.length ? d.photos : [null,null,null];
  slides.innerHTML = list.map(p => `<div class="slide">${p?`<img src="${p}" alt="展示写真">`:"展示写真"}</div>`).join("");
  dots.innerHTML = list.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("");
  slides.scrollLeft = 0;
  modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
  document.body.classList.add("lock");
}
function closeModal(){
  modal.classList.remove("open"); modal.setAttribute("aria-hidden","true");
  if (world.classList.contains("finished")) document.body.classList.remove("lock");
}
slides.addEventListener("scroll", () => {
  const n = Math.round(slides.scrollLeft/slides.clientWidth);
  [...dots.children].forEach((d,i)=>d.classList.toggle("on",i===n));
});
document.querySelectorAll("[data-circle]").forEach(b => b.onclick = () => openCircle(b.dataset.circle));
$("close").onclick = closeModal;
modal.addEventListener("click", e => { if (e.target===modal) closeModal(); });

/* ---- 円アイコンに画像があれば表示 ---- */
Object.entries(circleData).forEach(([id,d]) => {
  if (!d.icon) return;
  document.querySelectorAll(`[data-circle="${id}"]`).forEach(b => b.insertAdjacentHTML("afterbegin",`<img src="${d.icon}" alt="">`));
});

/* ---- スクロール表示 ---- */
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("visible")), {threshold:.2});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
